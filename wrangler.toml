name = "southshoresawyer"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"

# KV Namespace — create this first with:
# wrangler kv:namespace create BLOG_KV
# Then paste the id below
[[kv_namespaces]]
binding = "BLOG_KV"
id = "b8855e7ba60f4fe9b777afaacb1d4221"

# Routes
[[routes]]
pattern = "southshoresawyer.com/api/blog/*"
zone_name = "southshoresawyer.com"

# Secrets (set via: wrangler secret put ADMIN_PASSWORD)
# ADMIN_PASSWORD
# JWT_SECRET

# ── Second worker: log advisor ───────────────────────────────────────────────
# Deploy separately: wrangler deploy workers/log-advisor.js --name log-advisor
